name: CI

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go and linter caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
            ~/.cache/golangci-lint
          key: go-ci-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-ci-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-
            go-ci-${{ runner.os }}-

      - name: Install govulncheck
        run: |
          bin="$(go env GOPATH)/bin/govulncheck"
          if [ -x "$bin" ] && go version -m "$bin" | grep -Eq "^\s*mod\s+golang.org/x/vuln\s+${GOVULNCHECK_VERSION}\s"; then
            echo "govulncheck ${GOVULNCHECK_VERSION} restored from cache"
          else
            go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          fi

      - name: Verify
        run: make verify-ci

      # Run even if Verify fails so lint diagnostics surface in the same run.
      # Caching is handled by the unified restore/save steps above.
      - name: Lint
        if: ${{ !cancelled() }}
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 #v9.2.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          skip-cache: true

      - name: Save Go and linter caches
        if: ${{ github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/go/bin
            ~/.cache/golangci-lint
          key: go-ci-${{ runner.os }}-${{ env.GOLANGCI_LINT_VERSION }}-${{ env.GOVULNCHECK_VERSION }}-${{ hashFiles('go.mod', 'go.sum') }}
